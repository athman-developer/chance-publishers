name: Build Qiblah APK

on:
  push:
    branches:
      - qiblah-apk-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Qiblah Android project
        shell: bash
        run: |
          rm -rf qiblah_build
          mkdir -p qiblah_build/app/src/main/java/com/qiblah/direction
          mkdir -p qiblah_build/app/src/main/res/values

          cat > qiblah_build/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "QiblahDirection"
          include(":app")
          EOF

          cat > qiblah_build/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > qiblah_build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > qiblah_build/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.qiblah.direction"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.qiblah.direction"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > qiblah_build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.location" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Qiblah Direction"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > qiblah_build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#F7F3E8</item>
                  <item name="android:statusBarColor">#F7F3E8</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#C9A44B</item>
              </style>
          </resources>
          EOF

          cat > qiblah_build/app/src/main/java/com/qiblah/direction/MainActivity.java <<'EOF'
          package com.qiblah.direction;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Typeface;
          import android.hardware.GeomagneticField;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.Surface;
          import android.view.View;
          import android.view.Window;

          import java.util.Locale;

          public class MainActivity extends Activity implements SensorEventListener {
              private static final int LOCATION_REQUEST = 7;
              private SensorManager sensorManager;
              private LocationManager locationManager;
              private QiblahView qiblahView;

              private final float[] accel = new float[3];
              private final float[] magnet = new float[3];
              private boolean haveAccel = false;
              private boolean haveMagnet = false;

              private final LocationListener locationListener = new LocationListener() {
                  @Override
                  public void onLocationChanged(Location location) {
                      qiblahView.setLocation(location);
                  }

                  @Override public void onProviderEnabled(String provider) { }
                  @Override public void onProviderDisabled(String provider) { }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(247, 243, 232));
                  window.setNavigationBarColor(Color.rgb(247, 243, 232));

                  qiblahView = new QiblahView(this);
                  setContentView(qiblahView);

                  sensorManager = (SensorManager) getSystemService(SENSOR_SERVICE);
                  locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  requestLocationAccess();
              }

              private void requestLocationAccess() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, LOCATION_REQUEST);
                      return;
                  }
                  startLocationUpdates();
              }

              private void startLocationUpdates() {
                  if (locationManager == null) return;
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) return;

                  Location best = null;
                  String[] providers = new String[]{LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER};
                  for (String provider : providers) {
                      try {
                          if (!locationManager.isProviderEnabled(provider)) continue;
                          Location last = locationManager.getLastKnownLocation(provider);
                          if (last != null && (best == null || last.getAccuracy() < best.getAccuracy())) {
                              best = last;
                          }
                          locationManager.requestLocationUpdates(provider, 1500L, 1f, locationListener);
                      } catch (Exception ignored) { }
                  }
                  if (best != null) qiblahView.setLocation(best);
                  else qiblahView.setWaitingForLocation(true);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_REQUEST) {
                      boolean granted = false;
                      for (int result : grantResults) {
                          if (result == PackageManager.PERMISSION_GRANTED) {
                              granted = true;
                              break;
                          }
                      }
                      if (granted) startLocationUpdates();
                      else qiblahView.setPermissionDenied(true);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  Sensor a = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  Sensor m = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
                  if (a != null) sensorManager.registerListener(this, a, SensorManager.SENSOR_DELAY_UI);
                  if (m != null) sensorManager.registerListener(this, m, SensorManager.SENSOR_DELAY_UI);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  sensorManager.unregisterListener(this);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  try {
                      if (locationManager != null) locationManager.removeUpdates(locationListener);
                  } catch (Exception ignored) { }
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  final float alpha = 0.18f;
                  if (event.sensor.getType() == Sensor.TYPE_ACCELEROMETER) {
                      if (!haveAccel) {
                          System.arraycopy(event.values, 0, accel, 0, 3);
                          haveAccel = true;
                      } else {
                          for (int i = 0; i < 3; i++) accel[i] += alpha * (event.values[i] - accel[i]);
                      }
                  } else if (event.sensor.getType() == Sensor.TYPE_MAGNETIC_FIELD) {
                      if (!haveMagnet) {
                          System.arraycopy(event.values, 0, magnet, 0, 3);
                          haveMagnet = true;
                      } else {
                          for (int i = 0; i < 3; i++) magnet[i] += alpha * (event.values[i] - magnet[i]);
                      }
                  }

                  if (!haveAccel || !haveMagnet) return;

                  float[] rotation = new float[9];
                  float[] inclination = new float[9];
                  if (!SensorManager.getRotationMatrix(rotation, inclination, accel, magnet)) return;

                  float[] adjusted = new float[9];
                  int displayRotation = getWindowManager().getDefaultDisplay().getRotation();
                  boolean remapped;
                  switch (displayRotation) {
                      case Surface.ROTATION_90:
                          remapped = SensorManager.remapCoordinateSystem(rotation,
                                  SensorManager.AXIS_Y, SensorManager.AXIS_MINUS_X, adjusted);
                          break;
                      case Surface.ROTATION_180:
                          remapped = SensorManager.remapCoordinateSystem(rotation,
                                  SensorManager.AXIS_MINUS_X, SensorManager.AXIS_MINUS_Y, adjusted);
                          break;
                      case Surface.ROTATION_270:
                          remapped = SensorManager.remapCoordinateSystem(rotation,
                                  SensorManager.AXIS_MINUS_Y, SensorManager.AXIS_X, adjusted);
                          break;
                      default:
                          System.arraycopy(rotation, 0, adjusted, 0, 9);
                          remapped = true;
                  }
                  if (!remapped) return;

                  float[] orientation = new float[3];
                  SensorManager.getOrientation(adjusted, orientation);
                  float magneticAzimuth = (float) Math.toDegrees(orientation[0]);
                  if (magneticAzimuth < 0) magneticAzimuth += 360f;
                  qiblahView.setMagneticHeading(magneticAzimuth);
              }

              @Override public void onAccuracyChanged(Sensor sensor, int accuracy) { }
          }

          class QiblahView extends View {
              private static final double KAABA_LAT = 21.422487;
              private static final double KAABA_LON = 39.826206;

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private float magneticHeading = 0f;
              private float declination = 0f;
              private float qiblahBearing = 0f;
              private boolean hasLocation = false;
              private boolean permissionDenied = false;
              private boolean waitingForLocation = false;
              private boolean aligned = false;
              private double latitude = 0.0;
              private double longitude = 0.0;
              private float accuracy = 0f;

              QiblahView(Context context) {
                  super(context);
                  paint.setStrokeCap(Paint.Cap.ROUND);
              }

              void setLocation(Location location) {
                  latitude = location.getLatitude();
                  longitude = location.getLongitude();
                  accuracy = location.hasAccuracy() ? location.getAccuracy() : 0f;
                  qiblahBearing = (float) bearingToKaaba(latitude, longitude);
                  GeomagneticField field = new GeomagneticField(
                          (float) latitude,
                          (float) longitude,
                          (float) location.getAltitude(),
                          System.currentTimeMillis()
                  );
                  declination = field.getDeclination();
                  hasLocation = true;
                  waitingForLocation = false;
                  permissionDenied = false;
                  invalidate();
              }

              void setMagneticHeading(float heading) {
                  magneticHeading = heading;
                  invalidate();
              }

              void setPermissionDenied(boolean denied) {
                  permissionDenied = denied;
                  invalidate();
              }

              void setWaitingForLocation(boolean waiting) {
                  waitingForLocation = waiting;
                  invalidate();
              }

              private float trueHeading() {
                  float h = magneticHeading + declination;
                  while (h < 0) h += 360f;
                  while (h >= 360f) h -= 360f;
                  return h;
              }

              private double bearingToKaaba(double lat, double lon) {
                  double p1 = Math.toRadians(lat);
                  double p2 = Math.toRadians(KAABA_LAT);
                  double dl = Math.toRadians(KAABA_LON - lon);
                  double y = Math.sin(dl) * Math.cos(p2);
                  double x = Math.cos(p1) * Math.sin(p2)
                          - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
                  return (Math.toDegrees(Math.atan2(y, x)) + 360.0) % 360.0;
              }

              private float signedDifference(float target, float current) {
                  return ((target - current + 540f) % 360f) - 180f;
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  float w = getWidth();
                  float h = getHeight();
                  canvas.drawColor(Color.rgb(247, 243, 232));

                  paint.setStyle(Paint.Style.FILL);
                  paint.setTextAlign(Paint.Align.CENTER);
                  paint.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  paint.setColor(Color.rgb(11, 61, 46));
                  paint.setTextSize(w * 0.075f);
                  canvas.drawText("Qiblah Direction", w / 2f, h * 0.10f, paint);

                  paint.setTypeface(Typeface.DEFAULT);
                  paint.setTextSize(w * 0.037f);
                  paint.setColor(Color.rgb(90, 85, 72));
                  canvas.drawText("Turn until the gold arrow points straight up", w / 2f, h * 0.15f, paint);

                  float cx = w / 2f;
                  float cy = h * 0.46f;
                  float radius = Math.min(w * 0.40f, h * 0.255f);

                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.WHITE);
                  canvas.drawCircle(cx, cy, radius, paint);

                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(w * 0.010f);
                  paint.setColor(Color.rgb(201, 164, 75));
                  canvas.drawCircle(cx, cy, radius, paint);

                  for (int deg = 0; deg < 360; deg += 15) {
                      double a = Math.toRadians(deg - 90);
                      float outerX = cx + (float) Math.cos(a) * radius * 0.93f;
                      float outerY = cy + (float) Math.sin(a) * radius * 0.93f;
                      float innerScale = (deg % 45 == 0) ? 0.82f : 0.87f;
                      float innerX = cx + (float) Math.cos(a) * radius * innerScale;
                      float innerY = cy + (float) Math.sin(a) * radius * innerScale;
                      paint.setStrokeWidth(deg % 45 == 0 ? w * 0.007f : w * 0.003f);
                      paint.setColor(deg % 90 == 0 ? Color.rgb(11, 61, 46) : Color.rgb(185, 179, 162));
                      canvas.drawLine(innerX, innerY, outerX, outerY, paint);
                  }

                  paint.setStyle(Paint.Style.FILL);
                  paint.setTypeface(Typeface.DEFAULT_BOLD);
                  paint.setTextSize(w * 0.045f);
                  paint.setColor(Color.rgb(11, 61, 46));
                  String[] dirs = {"N", "E", "S", "W"};
                  for (int i = 0; i < 4; i++) {
                      double a = Math.toRadians(i * 90 - 90);
                      float tx = cx + (float) Math.cos(a) * radius * 0.72f;
                      float ty = cy + (float) Math.sin(a) * radius * 0.72f + w * 0.015f;
                      canvas.drawText(dirs[i], tx, ty, paint);
                  }

                  if (hasLocation) {
                      float heading = trueHeading();
                      float relative = signedDifference(qiblahBearing, heading);

                      canvas.save();
                      canvas.rotate(relative, cx, cy);

                      Path arrow = new Path();
                      arrow.moveTo(cx, cy - radius * 0.72f);
                      arrow.lineTo(cx - radius * 0.11f, cy - radius * 0.40f);
                      arrow.lineTo(cx - radius * 0.036f, cy - radius * 0.43f);
                      arrow.lineTo(cx - radius * 0.036f, cy + radius * 0.35f);
                      arrow.lineTo(cx + radius * 0.036f, cy + radius * 0.35f);
                      arrow.lineTo(cx + radius * 0.036f, cy - radius * 0.43f);
                      arrow.lineTo(cx + radius * 0.11f, cy - radius * 0.40f);
                      arrow.close();
                      paint.setColor(Color.rgb(201, 164, 75));
                      canvas.drawPath(arrow, paint);

                      paint.setColor(Color.BLACK);
                      canvas.drawRoundRect(
                              cx - radius * 0.13f, cy - radius * 0.29f,
                              cx + radius * 0.13f, cy - radius * 0.10f,
                              radius * 0.025f, radius * 0.025f, paint);
                      paint.setColor(Color.rgb(201, 164, 75));
                      canvas.drawRect(
                              cx - radius * 0.13f, cy - radius * 0.225f,
                              cx + radius * 0.13f, cy - radius * 0.19f, paint);
                      canvas.restore();

                      float diff = Math.abs(relative);
                      boolean nowAligned = diff <= 4f;
                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      paint.setTextSize(w * 0.050f);
                      paint.setColor(nowAligned ? Color.rgb(11, 120, 72) : Color.rgb(11, 61, 46));
                      canvas.drawText(nowAligned ? "✓ Qiblah aligned" : turnInstruction(relative),
                              w / 2f, h * 0.78f, paint);

                      paint.setTypeface(Typeface.DEFAULT);
                      paint.setTextSize(w * 0.039f);
                      paint.setColor(Color.DKGRAY);
                      canvas.drawText("Qiblah bearing: " + Math.round(qiblahBearing) + "°",
                              w / 2f, h * 0.835f, paint);
                      canvas.drawText("Phone heading: " + Math.round(heading) + "°",
                              w / 2f, h * 0.875f, paint);

                      paint.setTextSize(w * 0.029f);
                      paint.setColor(Color.GRAY);
                      String loc = String.format(Locale.US, "Location %.4f, %.4f", latitude, longitude);
                      if (accuracy > 0f) loc += "  •  ±" + Math.round(accuracy) + " m";
                      canvas.drawText(loc, w / 2f, h * 0.915f, paint);

                      if (nowAligned && !aligned) {
                          aligned = true;
                          vibrateOnce();
                      } else if (!nowAligned) {
                          aligned = false;
                      }
                  } else {
                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      paint.setTextSize(w * 0.046f);
                      paint.setColor(Color.rgb(11, 61, 46));
                      String status = permissionDenied
                              ? "Location permission is required"
                              : (waitingForLocation ? "Finding your location…" : "Allow location to calculate Qiblah");
                      canvas.drawText(status, w / 2f, h * 0.80f, paint);
                  }

                  paint.setTypeface(Typeface.DEFAULT);
                  paint.setTextSize(w * 0.026f);
                  paint.setColor(Color.GRAY);
                  canvas.drawText("For best accuracy, keep the phone flat and away from metal.",
                          w / 2f, h * 0.965f, paint);
              }

              private String turnInstruction(float relative) {
                  int amount = Math.round(Math.abs(relative));
                  if (relative > 0) return "Turn right " + amount + "°";
                  return "Turn left " + amount + "°";
              }

              @SuppressWarnings("deprecation")
              private void vibrateOnce() {
                  try {
                      Vibrator vibrator = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
                      if (vibrator != null && vibrator.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createOneShot(90, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              vibrator.vibrate(90);
                          }
                      }
                  } catch (Exception ignored) { }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: qiblah_build
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp qiblah_build/app/build/outputs/apk/debug/app-debug.apk QiblahDirection.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QiblahDirection-APK
          path: QiblahDirection.apk
          retention-days: 7
