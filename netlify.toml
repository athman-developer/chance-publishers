[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # script-src/style-src are set per-page by Astro's built-in CSP (astro.config.mjs)
    # with real hashes for bundled scripts/styles — frame-ancestors can't be expressed
    # via a <meta> CSP, so it's set here instead, alongside X-Frame-Options for older browsers.
    Content-Security-Policy = "frame-ancestors 'none'"
